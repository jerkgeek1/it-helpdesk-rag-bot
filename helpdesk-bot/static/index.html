<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Helpdesk Assistant</title>
<style>
  :root {
    --bg: #F4F5F7; --panel: #FFFFFF; --ink: #1B2430; --muted: #66707D; --line: #DDE1E6;
    --accent: #1F4FBF; --accent-ink: #FFFFFF; --bot: #EEF1F5; --focus: #F2B705;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141A; --panel: #181D25; --ink: #E6E9ED; --muted: #98A2AE; --line: #2B333E;
      --accent: #7FA6FF; --accent-ink: #0B1220; --bot: #212834; --focus: #F2B705;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .app { height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header h1 { margin: 0; font-size: 1.25rem; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .bot.pending { color: var(--muted); }
  .bot.error { border: 1px solid #C0392B; }
  .cite { font-size: .75em; vertical-align: super; color: var(--accent); font-weight: 600; }
  .sources { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
  .sources ul { margin: 4px 0 0; padding-left: 18px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
  .chip { cursor: pointer; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
  .chip:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
  .send { cursor: pointer; padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .send:disabled { opacity: .5; cursor: default; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>IT Helpdesk Assistant</h1>
    <p>Answers come from the company IT knowledge base, with sources.</p>
  </header>
  <main class="chat">
    <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
    <div class="suggest" id="suggest"></div>
    <form id="form" autocomplete="off">
      <input id="input" type="text" maxlength="500" placeholder="Ask an IT question…" aria-label="Your question">
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>
  <footer>AI-generated answers can be wrong. For urgent issues, contact the helpdesk directly.</footer>
</div>

<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const suggestEl = document.getElementById("suggest");
const history = [];
let controller = null;
let busy = false;

const SUGGESTIONS = [
  "How do I reset my password?",
  "My VPN won't connect",
  "How do I report a phishing email?",
  "How do I request new software?"
];
SUGGESTIONS.forEach((q) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = q;
  b.addEventListener("click", () => send(q));
  suggestEl.append(b);
});

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
addMsg("bot", "Hi! I can help with passwords, VPN, Wi-Fi, email, printers, software, laptops and security. What's the problem?");

function setBusy(on) {
  busy = on;
  input.disabled = on;
  sendBtn.textContent = on ? "Stop" : "Send";
  sendBtn.type = on ? "button" : "submit";
  if (!on) input.focus();
}
sendBtn.addEventListener("click", () => { if (busy && controller) controller.abort(); });

/* Render answer text with [n] markers as small superscripts (no innerHTML with model text). */
function renderAnswer(el, text) {
  el.textContent = "";
  text.split(/(\[\d+\])/g).forEach((part) => {
    if (/^\[\d+\]$/.test(part)) {
      const s = document.createElement("span");
      s.className = "cite"; s.textContent = part;
      el.append(s);
    } else if (part) {
      el.append(document.createTextNode(part));
    }
  });
}

function renderSources(el, text, sources) {
  if (!sources.length) return;
  const cited = new Set([...text.matchAll(/\[(\d+)\]/g)].map((m) => Number(m[1])));
  const shown = sources.filter((s) => cited.has(s.n));
  if (!shown.length) return;
  const box = document.createElement("div");
  box.className = "sources";
  box.append(document.createTextNode("Sources"));
  const ul = document.createElement("ul");
  shown.forEach((s) => {
    const li = document.createElement("li");
    li.textContent = `[${s.n}] ${s.title}: ${s.section}`;
    ul.append(li);
  });
  box.append(ul);
  el.append(box);
}

async function send(raw) {
  const text = raw.trim();
  if (!text || busy) return;
  input.value = "";
  suggestEl.hidden = true;
  addMsg("user", text);
  const bubble = addMsg("bot", "Thinking…");
  bubble.classList.add("pending");
  setBusy(true);
  controller = new AbortController();

  let answer = "", sources = [], failed = false;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-6) }),
      signal: controller.signal
    });
    if (!res.ok) {
      const detail = res.status === 429 ? "Too many requests. Please wait a moment and try again." : "Something went wrong. Please try again.";
      throw new Error(detail);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop();
      for (const frame of frames) {
        if (!frame.startsWith("data: ")) continue;
        const event = JSON.parse(frame.slice(6));
        if (event.type === "sources") sources = event.sources;
        else if (event.type === "token") {
          answer += event.text;
          bubble.classList.remove("pending");
          renderAnswer(bubble, answer);
          log.scrollTop = log.scrollHeight;
        } else if (event.type === "error") {
          failed = true;
          bubble.classList.remove("pending");
          bubble.classList.add("error");
          bubble.textContent = event.message;
        }
      }
    }
    if (!failed) {
      renderSources(bubble, answer, sources);
      history.push({ role: "user", content: text }, { role: "assistant", content: answer });
    }
  } catch (err) {
    bubble.classList.remove("pending");
    if (err.name === "AbortError") {
      renderAnswer(bubble, answer ? answer + " (stopped)" : "Stopped.");
    } else {
      bubble.classList.add("error");
      bubble.textContent = err.message || "Could not reach the server.";
    }
  } finally {
    controller = null;
    setBusy(false);
    log.scrollTop = log.scrollHeight;
  }
}

document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
</script>
</body>
</html>
